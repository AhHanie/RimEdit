<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RimEdit</title>
    <style>
      /* Pre-hydration fallback: self-contained so it renders before Vite/React load, and does not
         depend on src/styles/tokens.css (see index.html source/DOM test guarding this). */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f0f2f5;
        font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111318;
        }
      }
      #root {
        height: 100%;
      }
      .startup-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
      }
      .startup-fallback__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px 40px;
        border: 1px solid #d8dce5;
        border-radius: 8px;
        background: #f7f8fa;
        color: #1a2236;
      }
      @media (prefers-color-scheme: dark) {
        .startup-fallback__panel {
          border-color: #242934;
          background: #171a21;
          color: #e0e4ee;
        }
      }
      .startup-fallback__title {
        font-size: 14px;
        font-weight: 600;
      }
      .startup-fallback__spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        /* Matches --accent-muted/--accent in src/styles/tokens.css, kept as literal values here
           since this fallback must not depend on that stylesheet -- see the note above. */
        border: 2px solid rgba(33, 85, 201, 0.12);
        border-top-color: #2155c9;
        animation: startup-fallback-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .startup-fallback__spinner {
          border-color: rgba(122, 162, 255, 0.15);
          border-top-color: #7aa2ff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-fallback__spinner {
          animation: none;
        }
      }
      .startup-fallback__message {
        font-size: 12px;
        color: #5c6880;
      }
      @media (prefers-color-scheme: dark) {
        .startup-fallback__message {
          color: #8892a4;
        }
      }
      @keyframes startup-fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="startup-fallback">
        <div class="startup-fallback__panel">
          <span class="startup-fallback__title">RimEdit</span>
          <div class="startup-fallback__spinner" aria-hidden="true"></div>
          <p class="startup-fallback__message" role="status" aria-live="polite">Loading RimEdit…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
